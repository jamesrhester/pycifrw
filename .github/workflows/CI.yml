name: Test PyCIFRW

on:
  push:
    paths-ignore:
      - '.github/**'
      - 'README.md'
      
  pull_request:
    paths-ignore:
      - '.github/**'
      - 'README.md'

  workflow_dispatch:
  
jobs:
        test:
                runs-on: ubuntu-latest

                strategy:
                        matrix:
                                python-version: ['3.10']
                                os: [ubuntu-latest, macos13, macos-latest, windows-2022, windows-latest]
                steps:
                - name: Checkout code
                  uses: actions/checkout@v2

                - name: Set up Python ${{ matrix.python-version }}
                  uses: actions/setup-python@v2
                  with:
                          python-version: ${{ matrix.python-version }}

                - name: Install dependencies
                  run: |
                          python -m pip install --upgrade pip
                          pip install pytest
                          pip install .

                - name: Run tests
                  run: |
                          pytest TestPyCIFRW.py
                          pytest TestDrel.py
